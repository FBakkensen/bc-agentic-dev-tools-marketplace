    target:
      - page: null
        automationId: 8da61efd-0002-0003-0507-0b0d1113171d
        caption: Confirm
        runtimeRef: b2qb
    invokeType: No
    description: Invoke No on <caption>Confirm</caption>
  - type: page-closed
