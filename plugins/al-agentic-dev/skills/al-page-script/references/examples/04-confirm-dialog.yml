#   `invoke` with invokeType: Yes|No. Anonymous controls target by automationId + caption.
# (The `message` step in the reference §4 is the assert-a-Message()-dialog analogue; same model.)
# Trigger: Post on an empty journal line -> confirm -> clicked No (NO posting, no data change).
name: Recording
description: Test recording
