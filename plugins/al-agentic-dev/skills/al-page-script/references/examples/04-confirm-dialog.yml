      page: Item Journal
    modal: false
    runtimeId: b2gw
    description: Page <caption>Item Journals</caption> was shown.
  - type: invoke
    target:
      - page: Item Journal
        runtimeRef: b2gw
      - action: Post
    parameters: {}
    description: Invoke <caption>Post</caption>
  - type: page-shown                 # a Confirm dialog: no AL page name -> page: null + automationId + caption
