# CANONICAL recorder output - BC platform 28.0.49873.0, CRONUS / Assisted Setup -> Data Migration.
# Validates the NAVIGATEPAGE WIZARD:
#   wizard opens = page-shown source.page: <Wizard> (modal: true)
#   Next/Back/Finish = invoke on a named action control (ActionNext/ActionBack/ActionFinish);
#     advancing swaps content IN PLACE - no new page-shown per step.
#   Exit (X) = invoke CloseOk -> Confirm dialog (page: null + automationId + caption) -> Yes.
# Also: opening Assisted Setup = invoke invokeType: OpenTargetSettingsPage (session action).
name: 06-wizard-navigatepage
description: Open the Data Migration NavigatePage wizard, step Next, then exit without finishing.
start:
  profile: ORDER PROCESSOR
steps:
  - type: invoke
    invokeType: OpenTargetSettingsPage
    parameters:
      Page: 2
    description: Invoke OpenTargetSettingsPage
  - type: page-shown
    source:
      page: Assisted Setup
    modal: false
    runtimeId: bxd
    description: Page <caption>Assisted Setup</caption> was shown.
  - type: set-current-row
    target:
      - page: Assisted Setup
        runtimeRef: bxd
      - repeater: Group
    targetRecord:
      relative: 16
    description: Set current row in <caption>Group</caption>
  - type: invoke
    target:
      - page: Assisted Setup
        runtimeRef: bxd
      - repeater: Group
    parameters:
      AlwaysCommit: false
    description: Invoke row on <caption>Group</caption>
  - type: page-shown
    source:
      page: Data Migration Wizard
    modal: true
    runtimeId: byv
    description: Page <caption>Data Migration</caption> was shown.
  - type: invoke
    target:
      - page: Data Migration Wizard
        runtimeRef: byv
      - action: ActionNext
    description: Invoke <caption>Next</caption>
  - type: invoke
    target:
      - page: Data Migration Wizard
        runtimeRef: byv
    invokeType: CloseOk
    description: Invoke CloseOk on <caption>Data Migration</caption>
  - type: page-shown
    source:
      page: null
      automationId: 8da61efd-0002-0003-0507-0b0d1113171d
      caption: Confirm
    modal: true
    runtimeId: b120
    description: Page <caption>Confirm</caption> was shown.
  - type: invoke
    target:
      - page: null
        automationId: 8da61efd-0002-0003-0507-0b0d1113171d
        caption: Confirm
        runtimeRef: b120
    invokeType: Yes
    description: Invoke Yes on <caption>Confirm</caption>
  - type: page-closed
    source:
      page: null
    runtimeId: b120
    description: Page <caption>Confirm</caption> was closed.
  - type: page-closed
    source:
      page: Data Migration Wizard
    runtimeId: byv
    description: Page <caption>Data Migration</caption> was closed.
