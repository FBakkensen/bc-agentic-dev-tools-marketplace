# HAND-AUTHORED — BC platform 28.0.49873.0, CRONUS / Sales Orders.
# Validates the AUTHORING DISCIPLINE used by /al-page-script generation:
#   No. Series first: the page assigns a fresh Sales Order No. per replay
#     (no literal "SO-1001"), sidestepping cross-replay collisions.
#   copy-value capture: the auto-assigned No. is unknown at authoring time;
#     the recording captures it from the No. field on the freshly-opened card
#     under name: salesorder-no.
#   =Clipboard reference: later assertions reference the captured value via
#     =Clipboard.'salesorder-no'.
# Same shape applies to any auto-generated document/journal/ledger entry No.
name: Recording
description: Insert Sales Order via No. Series, capture No., assert No equals captured value
start:
  profile: ORDER PROCESSOR
steps:
  - type: navigate
    target:
      - page: Order Processor Role Center
      - action: SalesOrders
    description: Navigate to Sales Orders
  - type: page-shown
    source:
      page: Sales Order List
    modal: false
    runtimeId: sol1
    description: Sales Orders list shown
  - type: invoke
    target:
      - page: Sales Order List
        runtimeRef: sol1
    invokeType: Control_New
    description: Press New — creates a Sales Order; No. Series assigns the No.
  - type: page-shown
    source:
      page: Sales Order
    modal: false
    runtimeId: so1
    description: New Sales Order card shown with auto-assigned No.
  - type: copy-value
    source:
      - page: Sales Order
        runtimeRef: so1
      - field: No.
    name: salesorder-no
    valueType: string
    description: Capture the auto-assigned No. into clipboard key salesorder-no
  - type: validate
    target:
      - page: Sales Order
        runtimeRef: so1
      - field: No.
    operation: "<>"
    value: ""
    description: No. is non-empty (No. Series fired)
  - type: validate
    target:
      - page: Sales Order
        runtimeRef: so1
      - field: No.
    operation: "="
    value: "=Clipboard.'salesorder-no'"
    description: No. equals the captured value (proves the clipboard read shape)
  - type: close-page
    target:
      - page: Sales Order
        runtimeRef: so1
    description: Close the Sales Order
  - type: page-closed
    source:
      page: Sales Order
    runtimeId: so1
    description: Sales Order closed
