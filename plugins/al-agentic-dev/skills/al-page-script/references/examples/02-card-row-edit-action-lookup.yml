# CANONICAL recorder output — BC platform 28.0.49873.0, CRONUS / Items.
# Validates: row Edit-invoke (open Card), action invoke (action: <ControlName>),
# non-modal content page-shown, lookup/peek page (page: peek:<Field> / lookup:<Field>).
name: Recording
description: Test recording
telemetryId: bf2fcaa9-06b0-4f41-bd5d-75f8956032c2
start:
  profile: ORDER PROCESSOR
steps:
  - type: navigate                     # self-contained: navigate to the list first
    target:
      - page: Order Processor Role Center
      - action: Items
    description: Navigate to <caption>Items</caption>
  - type: page-shown
    source:
      page: Item List
    modal: false
    runtimeId: bm2
    description: Page <caption>Items</caption> was shown.
  - type: set-current-row
    target:
      - page: Item List
        runtimeRef: bm2
      - repeater: Control1
    targetRecord:
      relative: -1
    description: Set current row in <caption>Item</caption>
  - type: invoke                       # opening a Card from a list row = an "Edit" row invoke
    target:
      - page: Item List
        runtimeRef: bm2
      - repeater: Control1
    invokeType: Edit
    parameters:
      AlwaysCommit: false
    description: Invoke row on <caption>Item</caption>
  - type: page-shown
    source:
      page: Item Card
    modal: false
    runtimeId: b113
    description: Page <caption>Item Card</caption> was shown.
  - type: invoke
    target:
      - page: Item Card
        runtimeRef: b113
    invokeType: DismissTour
    description: Invoke DismissTour on <caption>Item Card</caption>
  - type: close-page
    target:
      - page: Item Card
        runtimeRef: b113
    description: Close page <caption>Item Card</caption>
  - type: page-closed
    source:
      page: Item Card
    runtimeId: b113
    description: Page <caption>Item Card</caption> was closed.
  - type: invoke                       # a page ACTION: target leaf is `action: <ControlName>`
    target:
      - page: Item List
        runtimeRef: bm2
      - action: Action37
    description: Invoke <caption>Sales Orders</caption>
  - type: page-shown
    source:
      page: Sales Orders
    modal: false
    runtimeId: b1ea
    description: Page <caption>Sales Orders</caption> was shown.
  - type: invoke                       # a field Lookup; target nests page -> repeater -> field
    target:
      - page: Sales Orders
        runtimeRef: b1ea
      - repeater: Control1
      - field: Document No.
    invokeType: Lookup
    description: Invoke Lookup on <caption>Document No.</caption>
  - type: page-shown                   # the lookup surfaces as a peek/select page
    source:
      page: peek:Document No.
    modal: false
    runtimeId: b1ht
    description: Page <caption>Select</caption> was shown.
  - type: close-page
    target:
      - page: peek:Document No.
        runtimeRef: b1ht
    description: Close page <caption>Select</caption>
  - type: page-closed
    source:
      page: peek:Document No.
    runtimeId: b1ht
    description: Page <caption>Select</caption> was closed.
