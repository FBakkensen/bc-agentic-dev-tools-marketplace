<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branch feed &middot; <!--BRANCH--></title>
<style>
  :root {
    color-scheme: dark;
    --bg:        #0f1822;
    --paper:     #131d29;
    --ink:       #ecf2f8;
    --ink-soft:  #b5c2d0;
    --ink-faint: #94a3b5;
    --rule:      rgba(255,255,255,.09);
    --rule-soft: rgba(255,255,255,.055);
    --accent:    #6cc9c7;
    --accent-bg: rgba(108,201,199,.13);
    --chip-bg:   rgba(255,255,255,.06);
    --shadow:    0 1px 2px rgba(0,0,0,.30), 0 10px 30px rgba(0,0,0,.38);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 64px 28px 120px; }

  /* ---- Masthead ---- */
  header.masthead { margin-bottom: 48px; padding-left: 4px; }
  .branch-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; letter-spacing: .04em; color: var(--ink-faint); margin-bottom: 14px;
  }
  .branch-eyebrow .glyph { color: var(--accent); font-size: 13px; }
  .branch-eyebrow code {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 12.5px; color: var(--ink-soft); background: var(--chip-bg);
    padding: 2px 7px; border-radius: 5px;
  }
  h1.feature-title {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 500; font-size: 30px; line-height: 1.25; letter-spacing: -.01em;
    margin: 0; max-width: 18em; color: #f5f9fc;
  }
  .masthead-sub { margin-top: 12px; font-size: 13.5px; color: var(--ink-faint); }

  /* ---- Timeline rail ---- */
  .timeline { position: relative; padding-left: 40px; }
  .timeline::before {
    content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 1.5px;
    background: linear-gradient(to bottom, transparent, var(--rule) 6%, var(--rule) 94%, transparent);
  }
  .entry { position: relative; margin-bottom: 28px; }
  .entry:last-child { margin-bottom: 0; }
  .dot {
    position: absolute; left: -38.5px; top: 26px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--paper); border: 1.5px solid var(--rule);
    transition: border-color .4s ease, background .4s ease, box-shadow .4s ease;
  }
  .entry.is-open .dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-bg); }

  /* ---- Card ---- */
  .card {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: var(--shadow); transition: border-color .4s ease, box-shadow .4s ease;
  }
  .entry.is-open .card { box-shadow: 0 1px 2px rgba(0,0,0,.30), 0 18px 46px rgba(0,0,0,.45); }

  .card-head {
    display: block; width: 100%; text-align: left; background: none; border: 0; margin: 0;
    padding: 22px 24px; cursor: pointer; font: inherit; color: inherit; border-radius: 14px;
    transition: background .25s ease;
  }
  .card-head:hover { background: rgba(108,201,199,.06); }
  .card-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card-head--flat { cursor: default; }
  .card-head--flat:hover { background: none; }

  .card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .skill-chip {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 11.5px; letter-spacing: .01em; color: var(--accent); background: var(--accent-bg);
    padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  }
  .time { font-size: 12.5px; color: var(--ink-faint); margin-left: auto; white-space: nowrap; }
  .punchline {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 500; font-size: 19.5px; line-height: 1.4; letter-spacing: -.005em;
    color: var(--ink); margin: 0;
  }
  .card-head .hint {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
    font-size: 12.5px; color: var(--ink-faint); transition: opacity .3s ease;
  }
  .card-head .hint .chev { transition: transform .4s ease; color: var(--accent); }
  .entry.is-open .card-head .hint { display: none; }

  /* ---- Layers ---- */
  .layers { padding: 0 24px; }
  .layer {
    overflow: hidden; max-height: 0; opacity: 0; transform: translateY(-4px);
    transition: max-height .55s cubic-bezier(.22,.61,.36,1), opacity .5s ease .05s, transform .5s cubic-bezier(.22,.61,.36,1) .05s;
  }
  .layer.revealed { opacity: 1; transform: translateY(0); }
  .layer-inner { padding: 4px 0 0; border-top: 1px solid var(--rule-soft); margin-top: 18px; padding-top: 18px; }
  .layer:first-child .layer-inner { border-top: 0; margin-top: 6px; padding-top: 2px; }
  .layer-label {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 7px;
  }
  .layer-body { font-size: 15.5px; line-height: 1.62; color: var(--ink-soft); margin: 0; }

  /* ---- Foot ---- */
  .card-foot { padding: 18px 24px 22px; }
  .more-btn {
    display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; padding: 8px 0; margin: 0;
    cursor: pointer; font: inherit; font-size: 14px; color: var(--accent); letter-spacing: .005em;
    transition: opacity .3s ease, gap .25s ease;
  }
  .more-btn:hover { gap: 13px; }
  .more-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .more-btn .arc {
    display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    border: 1.4px solid var(--accent); transition: background .25s ease;
  }
  .more-btn:hover .arc { background: var(--accent-bg); }
  .more-btn .arc svg { display: block; }
  .end-marker {
    font-style: italic; font-size: 13.5px; color: var(--ink-faint); padding: 4px 0 2px;
    opacity: 0; transition: opacity .6s ease;
  }
  .end-marker.shown { opacity: 1; }
  .pips { display: inline-flex; gap: 5px; margin-left: 14px; vertical-align: middle; }
  .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--rule); transition: background .35s ease; }
  .pip.lit { background: var(--accent); }

  /* ---- Empty / footer ---- */
  .empty-note { color: var(--ink-faint); font-style: italic; text-align: center; padding: 24px 4px; }
  .ledger-note {
    margin-top: 56px; padding-left: 4px; text-align: center; font-size: 12.5px;
    color: var(--ink-faint); letter-spacing: .01em;
  }
  .ledger-note code {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 12px; color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .layer, .more-btn, .dot, .card, .end-marker, .card-head .hint .chev { transition: none !important; }
  }
  @media (max-width: 540px) {
    .wrap { padding: 44px 18px 90px; }
    h1.feature-title { font-size: 25px; }
    .timeline { padding-left: 30px; }
    .dot { left: -28.5px; }
    .punchline { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <header class="masthead">
      <span class="branch-eyebrow">
        <span class="glyph" aria-hidden="true">&#9679;</span>
        on branch
        <code><!--BRANCH--></code>
      </span>
      <h1 class="feature-title"><!--TITLE--></h1>
      <p class="masthead-sub">A quiet record of what the agent did. Newest first. Open a card to follow the reasoning, one breath at a time.</p>
    </header>

    <main class="timeline" id="timeline"><!--FEED_CARDS--></main>

    <p class="ledger-note">
      Read-only. To act, return to your terminal &mdash; e.g. <code>/al-steer</code>.
    </p>

  </div>

<script>
(function () {
  "use strict";

  var arrowDown =
    '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 5v14M6 13l6 6 6-6"/></svg>';

  document.querySelectorAll('.timeline .entry').forEach(function (entry) {
    var foot = entry.querySelector('.card-foot');
    if (!foot) return;                       // punchline-only card: nothing to disclose

    var head      = entry.querySelector('.card-head');
    var layersWrap = entry.querySelector('.layers');
    var layerEls  = Array.prototype.slice.call(layersWrap.querySelectorAll('.layer'));
    var moreBtn   = entry.querySelector('.more-btn');
    var pips      = Array.prototype.slice.call(entry.querySelectorAll('.pip'));
    var end       = entry.querySelector('.end-marker');
    var total     = layerEls.length;
    var revealed  = 0;

    function setMoreLabel() {
      if (revealed >= total) return;
      moreBtn.innerHTML = '<span class="arc">' + arrowDown + '</span><span>Tell me more</span>';
    }

    function revealNext() {
      if (revealed >= total) return;
      var l = layerEls[revealed];
      // Measure the layer's FULL natural height (margin included) by briefly
      // releasing the clamp, then animate 0 -> height, then release to auto so
      // a reflow can never clip the text. Release ONLY on the max-height end.
      l.classList.add('revealed');
      l.style.maxHeight = 'none';
      var h = l.getBoundingClientRect().height;
      l.style.maxHeight = '0px';
      void l.offsetHeight;
      l.style.maxHeight = h + 'px';
      // If no transition will run (e.g. prefers-reduced-motion sets
      // transition:none), transitionend never fires — release the clamp now so
      // a later reflow can't clip the text against a stale fixed max-height.
      if (parseFloat(getComputedStyle(l).transitionDuration) === 0) {
        l.style.maxHeight = 'none';
      } else {
        if (l._te) l.removeEventListener('transitionend', l._te);
        l._te = function te(ev) {
          if (ev.propertyName !== 'max-height') return;
          if (l.classList.contains('revealed')) l.style.maxHeight = 'none';
          l.removeEventListener('transitionend', te);
          l._te = null;
        };
        l.addEventListener('transitionend', l._te);
      }
      if (pips[revealed]) pips[revealed].classList.add('lit');
      revealed += 1;
      if (revealed >= total) { moreBtn.style.display = 'none'; end.classList.add('shown'); }
      else { setMoreLabel(); }
    }

    function openCard() {
      entry.classList.add('is-open');
      head.setAttribute('aria-expanded', 'true');
      foot.style.display = 'block';
      setMoreLabel();
      revealNext();
    }

    function collapseCard() {
      entry.classList.remove('is-open');
      head.setAttribute('aria-expanded', 'false');
      foot.style.display = 'none';
      end.classList.remove('shown');
      moreBtn.style.display = '';
      layerEls.forEach(function (l) {
        if (l._te) { l.removeEventListener('transitionend', l._te); l._te = null; }
        l.classList.remove('revealed'); l.style.maxHeight = '0px';
      });
      pips.forEach(function (p) { p.classList.remove('lit'); });
      revealed = 0;
    }

    head.addEventListener('click', function () {
      entry.classList.contains('is-open') ? collapseCard() : openCard();
    });
    moreBtn.addEventListener('click', function (e) { e.stopPropagation(); revealNext(); });
  });
})();
</script>
</body>
</html>
