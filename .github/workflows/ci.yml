name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: pwsh
        run: ./scripts/Validate-Json.ps1

      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./scripts/Validate-PowerShell.ps1

      - name: Check plugin structure
        shell: pwsh
        run: ./scripts/Validate-PluginStructure.ps1

  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          }
          $r = Invoke-Pester -Path tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
